<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduled-DB — Live Simulator</title>
<meta name="description" content="Interactive WebAssembly simulator for visualizing job scheduling with the hierarchical timing wheel engine.">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#b3ffb3;font-family:'Courier New',monospace;font-size:13px;line-height:1.5;
  overflow:hidden;height:100vh;display:flex;flex-direction:column}
::selection{background:#00ff41;color:#080808}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#080808}
::-webkit-scrollbar-thumb{background:#1a3a1a;border-radius:2px}

/* Scanlines */
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1) 0px,rgba(0,0,0,0.1) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:9999}

/* ── LAYOUT ─────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;padding:4px;gap:4px}

/* Status bar */
#status{display:flex;align-items:center;gap:16px;padding:6px 12px;
  border:1px solid #1a3a1a;border-radius:4px;background:rgba(0,0,0,0.4);
  font-size:11px;min-height:32px;flex-shrink:0}
#status .stat{color:#3a5a3a}
#status .stat span{color:#00ff41}
#status .stat .cy{color:#00cccc}
#status .stat .am{color:#ffb000}
#status .err{color:#ff5f56}

/* Main grid */
#main{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:1;min-height:0}

/* Panels */
.panel{border:1px solid #1a3a1a;border-radius:4px;background:rgba(0,0,0,0.3);
  display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:6px 10px;border-bottom:1px solid #1a3a1a;
  font-size:10px;color:#3a5a3a;letter-spacing:1px;text-transform:uppercase;
  background:rgba(0,0,0,0.2);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.panel-body{flex:1;overflow-y:auto;padding:4px;font-size:12px}
.panel-body pre{margin:0;white-space:pre-wrap;word-break:break-all}

/* ── TIMING WHEEL PANEL ─────────────────────────── */
#wheel-canvas{width:100%;height:100%;display:block;cursor:grab}

/* ── JOB LIST ───────────────────────────────────── */
#job-list .job-entry{padding:3px 8px;border-bottom:1px solid #0d1f0d;font-size:11px;
  display:flex;align-items:center;gap:6px}
#job-list .job-entry:last-child{border:none}
#job-list .job-id{color:#00cccc;font-family:inherit;font-size:10px;min-width:80px}
#job-list .job-type{font-size:9px;padding:1px 5px;border-radius:2px;border:1px solid;min-width:40px;text-align:center}
#job-list .job-type.unico{color:#ffb000;border-color:#1a4a1a}
#job-list .job-type.recurrente{color:#00cccc;border-color:#1a4a4a}
#job-list .job-status{font-size:10px;min-width:60px}
#job-list .job-status.pending{color:#556b55}
#job-list .job-status.in_progress{color:#ffb000}
#job-list .job-status.completed{color:#00ff41}
#job-list .job-status.failed{color:#ff5f56}
#job-list .job-status.cancelled{color:#3a5a3a}
#job-list .job-ts{color:#3a5a3a;font-size:9px;margin-left:auto}
#job-list .empty{color:#1a3a1a;text-align:center;padding:20px;font-size:11px}

/* ── EXECUTION LOG ──────────────────────────────── */
#exec-log .log-entry{padding:2px 8px;font-size:10px;color:#556b55;border-bottom:1px solid #0a1a0a}
#exec-log .log-entry .ts{color:#3a5a3a;margin-right:8px}
#exec-log .log-entry.success{color:#00ff41}
#exec-log .log-entry.fail{color:#ff5f56}
#exec-log .empty{color:#1a3a1a;text-align:center;padding:20px;font-size:11px}

/* ── BOTTOM BAR ─────────────────────────────────── */
#bottom{display:flex;gap:4px;flex-shrink:0;min-height:32px}
#bottom input{flex:1;background:rgba(0,0,0,0.4);border:1px solid #1a3a1a;border-radius:4px;
  padding:0 10px;color:#00ff41;font-family:'Courier New',monospace;font-size:12px;outline:none}
#bottom input:focus{border-color:#00ff41}
#bottom input::placeholder{color:#1a3a1a}
#bottom button{background:rgba(0,0,0,0.4);border:1px solid #1a3a1a;border-radius:4px;
  color:#3a5a3a;padding:0 14px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;
  transition:all .15s;white-space:nowrap}
#bottom button:hover{border-color:#00ff41;color:#00ff41}
#bottom button.danger:hover{border-color:#ff5f56;color:#ff5f56}
#bottom button.accent{color:#00cccc;border-color:#1a4a4a}
#bottom button.accent:hover{border-color:#00cccc;color:#00cccc}

/* ── MODAL ──────────────────────────────────────── */
#modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
#modal-overlay.open{display:flex}
#modal{border:1px solid #1a3a1a;border-radius:6px;background:#0a0a0a;padding:24px;
  min-width:340px;max-width:500px;width:90%}
#modal h3{font-size:14px;color:#00ff41;margin-bottom:16px;letter-spacing:1px}
#modal label{display:block;font-size:11px;color:#3a5a3a;margin-bottom:4px;margin-top:12px}
#modal label:first-child{margin-top:0}
#modal input,#modal select{width:100%;background:rgba(0,0,0,0.4);border:1px solid #1a3a1a;
  border-radius:3px;padding:8px 10px;color:#b3ffb3;font-family:'Courier New',monospace;font-size:12px;outline:none}
#modal input:focus,#modal select:focus{border-color:#00ff41}
#modal select option{background:#0a0a0a;color:#b3ffb3}
#modal .btn-row{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
#modal .btn-row button{padding:8px 20px;border-radius:3px;font-family:'Courier New',monospace;
  font-size:12px;cursor:pointer;transition:all .15s}
#modal .btn-cancel{background:none;border:1px solid #1a3a1a;color:#3a5a3a}
#modal .btn-cancel:hover{border-color:#556b55;color:#556b55}
#modal .btn-submit{background:#00ff41;border:none;color:#080808;font-weight:700}
#modal .btn-submit:hover{background:#00cc35}

/* ── TOAST ──────────────────────────────────────── */
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  background:#0a0a0a;border:1px solid #1a3a1a;border-radius:4px;padding:8px 20px;
  font-size:11px;color:#00ff41;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
#toast.err{color:#ff5f56}

/* ── RESPONSIVE ─────────────────────────────────── */
@media(max-width:800px){
  #main{grid-template-columns:1fr}
  #status{flex-wrap:wrap;gap:8px;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <!-- Status Bar -->
  <div id="status">
    <div class="stat"><span>SCHEDULED-DB</span> SIMULATOR</div>
    <div class="stat" style="margin-left:auto">⏱ <span id="now-display">---</span></div>
    <div class="stat">⚡ <span id="speed-display" class="cy">1.0x</span></div>
    <div class="stat">◈ <span id="job-count" class="cy">0</span></div>
    <div class="stat">▶ <span id="exec-count" class="am">0</span></div>
    <div class="stat" id="status-msg" style="color:#1a3a1a;font-size:10px">← type <span style="color:#3a5a3a">help</span> in the terminal</div>
  </div>

  <!-- Main Grid -->
  <div id="main">
    <!-- Left Column -->
    <div style="display:flex;flex-direction:column;gap:4px;min-height:0">
      <!-- Timing Wheel -->
      <div class="panel" style="flex:1">
        <div class="panel-head">
          <span>◆ Timing Wheel</span>
          <span id="wheel-info" style="color:#1a3a1a;font-size:10px">0 slots</span>
        </div>
        <div class="panel-body" style="padding:0;overflow:hidden">
          <canvas id="wheel-canvas"></canvas>
        </div>
      </div>
      <!-- Execution Log -->
      <div class="panel" style="flex:0.8">
        <div class="panel-head">
          <span>■ Execution Log</span>
          <span style="color:#1a3a1a;font-size:10px">last 50</span>
        </div>
        <div class="panel-body" id="exec-log">
          <div class="empty">⏳ awaiting execution...</div>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div style="display:flex;flex-direction:column;gap:4px;min-height:0">
      <!-- Job List -->
      <div class="panel" style="flex:1">
        <div class="panel-head">
          <span>● Job Queue</span>
          <span style="color:#1a3a1a;font-size:10px" id="job-count-label">0 jobs</span>
        </div>
        <div class="panel-body" id="job-list">
          <div class="empty">◇ no jobs scheduled</div>
        </div>
      </div>
      <!-- Slots / Debug -->
      <div class="panel" style="flex:0.6">
        <div class="panel-head">
          <span>▣ Slot Map</span>
          <span style="color:#1a3a1a;font-size:10px" id="slot-count-label">0 slots</span>
        </div>
        <div class="panel-body" id="slot-list">
          <div class="empty">◇ no active slots</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Terminal Bar -->
  <div id="bottom">
    <input id="cmd-input" type="text" placeholder="$ type a command (help, create, tick, advance, speed, reset)" autofocus spellcheck="false">
    <button id="btn-tick" class="accent">[ tick ]</button>
    <button id="btn-create" class="accent">[ create ]</button>
    <button id="btn-reset" class="danger">[ reset ]</button>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <h3>$ create_job</h3>
    <label>Job Type</label>
    <select id="modal-type">
      <option value="unico">unico (one-time)</option>
      <option value="recurrente">recurrente (cron)</option>
    </select>
    <label id="modal-ts-label">Timestamp (RFC3339 or epoch)</label>
    <input id="modal-ts" type="text" placeholder="2025-12-25T10:00:00Z">
    <label id="modal-cron-label" style="display:none">Cron Expression</label>
    <input id="modal-cron" type="text" placeholder="0 3 * * *" style="display:none">
    <label>Webhook URL (optional)</label>
    <input id="modal-webhook" type="text" placeholder="https://example.com/hook">
    <label>Payload (optional JSON)</label>
    <input id="modal-payload" type="text" placeholder='{"key":"value"}'>
    <div class="btn-row">
      <button class="btn-cancel" id="modal-cancel">cancel</button>
      <button class="btn-submit" id="modal-submit">create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="wasm_exec.js"></script>
<script>
// ── App State ──────────────────────────────────
let sim = null;
let ready = false;
let state = { now: 0, clock_speed: 1, jobs: {}, slots: {}, execution_states: {}, exec_log: [], wheel_size: 0, tick_count: 0, total_executed: 0, total_rescheduled: 0 };
let animFrame = null;
let wheelCanvas, wheelCtx;

// ── Toast ──────────────────────────────────────
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = isErr ? '✗ ' + msg : '✓ ' + msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2000);
}

// ── Load WASM ──────────────────────────────────
async function loadWasm() {
  const status = document.getElementById('status-msg');
  status.textContent = '⏳ loading WASM...';
  status.style.color = '#ffb000';

  if (!WebAssembly.instantiateStreaming) {
    // Fallback for environments without instantiateStreaming
    const resp = await fetch('scheduled-db.wasm');
    const bytes = await resp.arrayBuffer();
    const { instance } = await WebAssembly.instantiate(bytes, go.importObject);
    go.run(instance);
  } else {
    const resp = await fetch('scheduled-db.wasm');
    const { instance } = await WebAssembly.instantiateStreaming(resp, go.importObject);
    go.run(instance);
  }

  sim = window.simulator;
  if (!sim) {
    status.textContent = '✗ failed to load simulator';
    status.style.color = '#ff5f56';
    toast('WASM load failed', true);
    return;
  }

  ready = true;
  status.textContent = '✓ simulator ready — try create, tick, or advance';
  status.style.color = '#00ff41';
  toast('simulator loaded');
  refresh();
  startWheelAnimation();
}

// ── Fetch State ────────────────────────────────
function fetchState() {
  if (!ready || !sim) return;
  try {
    const raw = sim.getStateJSON();
    state = JSON.parse(raw);
  } catch(e) {
    // partial state is ok
  }
}

// ── DOM Updates ────────────────────────────────
function refresh() {
  if (!ready) return;
  fetchState();

  // Status bar
  const nowDate = state.now ? new Date(state.now * 1000).toISOString().replace('T',' ').slice(0,19) + 'Z' : '---';
  document.getElementById('now-display').textContent = nowDate;
  document.getElementById('speed-display').textContent = state.clock_speed.toFixed(1) + 'x';
  const jobCount = state.jobs ? Object.keys(state.jobs).length : 0;
  document.getElementById('job-count').textContent = jobCount;
  document.getElementById('exec-count').textContent = state.total_executed || 0;
  document.getElementById('job-count-label').textContent = jobCount + ' jobs';
  document.getElementById('wheel-info').textContent = (state.wheel_size || 0) + ' slots';

  // Job List
  const jobList = document.getElementById('job-list');
  const jobEntries = state.jobs ? Object.entries(state.jobs) : [];
  if (jobEntries.length === 0) {
    jobList.innerHTML = '<div class="empty">◇ no jobs scheduled</div>';
  } else {
    jobList.innerHTML = jobEntries.map(([id, job]) => {
      const ex = state.execution_states?.[id];
      const status = ex ? ex.status : 'pending';
      const statusClass = status === 'in_progress' ? 'in_progress' : status;
      return `<div class="job-entry">
        <span class="job-id">${id.slice(0,8)}</span>
        <span class="job-type ${job.type}">${job.type}</span>
        <span class="job-status ${statusClass}">${status}</span>
        <span class="job-ts">${job.timestamp || job.cron_expression || ''}</span>
      </div>`;
    }).join('');
  }

  // Execution Log
  const execLog = document.getElementById('exec-log');
  const log = state.exec_log || [];
  if (log.length === 0) {
    execLog.innerHTML = '<div class="empty">⏳ awaiting execution...</div>';
  } else {
    const recent = log.slice(-50).reverse();
    execLog.innerHTML = recent.map(e => {
      const cls = e.success ? 'success' : 'fail';
      const t = new Date(e.timestamp * 1000).toISOString().slice(11,19);
      return `<div class="log-entry ${cls}">
        <span class="ts">[${t}]</span>
        ${e.job_id ? e.job_id.slice(0,8) : '???'}
        ${e.success ? '✓ completed' : '✗ failed'}
        <span style="color:#3a5a3a">${e.response_time || 0}ms</span>
      </div>`;
    }).join('');
  }

  // Slot List
  const slotList = document.getElementById('slot-list');
  const slots = state.slots ? Object.entries(state.slots) : [];
  const slotCountLabel = document.getElementById('slot-count-label');
  slotCountLabel.textContent = slots.length + ' slots';
  if (slots.length === 0) {
    slotList.innerHTML = '<div class="empty">◇ no active slots</div>';
  } else {
    slotList.innerHTML = slots.map(([key, slot]) => {
      const minDate = new Date(slot.min_time * 1000).toISOString().slice(11,19);
      const maxDate = new Date(slot.max_time * 1000).toISOString().slice(11,19);
      const jobCount = slot.job_ids ? slot.job_ids.length : 0;
      return `<div class="job-entry" style="font-size:10px">
        <span style="color:#ffb000">◈</span>
        <span style="color:#00cccc;font-size:9px">${minDate}–${maxDate}</span>
        <span style="color:#556b55">${jobCount} jobs</span>
        <span style="color:#3a5a3a;margin-left:auto;font-size:8px">key:${key}</span>
      </div>`;
    }).join('');
  }
}

// ── Timing Wheel Canvas ────────────────────────
function initWheelCanvas() {
  wheelCanvas = document.getElementById('wheel-canvas');
  wheelCtx = wheelCanvas.getContext('2d');
}

function resizeWheel() {
  if (!wheelCanvas) return;
  const rect = wheelCanvas.parentElement.getBoundingClientRect();
  wheelCanvas.width = rect.width * window.devicePixelRatio;
  wheelCanvas.height = rect.height * window.devicePixelRatio;
  wheelCanvas.style.width = rect.width + 'px';
  wheelCanvas.style.height = rect.height + 'px';
  wheelCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resizeWheel);

let wheelRotation = 0;
function drawWheel() {
  if (!wheelCtx || !wheelCanvas) return;
  const rect = wheelCanvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(cx, cy) - 20;

  wheelCtx.clearRect(0, 0, w, h);

  // Background
  wheelCtx.fillStyle = 'rgba(8,8,8,0.5)';
  wheelCtx.fillRect(0, 0, w, h);

  // Get slots data
  const slots = state.slots || {};
  const slotKeys = Object.keys(slots);
  const slotCount = slotKeys.length;

  // Outer ring (timing wheel)
  const outerR = maxR;
  wheelCtx.beginPath();
  wheelCtx.arc(cx, cy, outerR, 0, Math.PI * 2);
  wheelCtx.strokeStyle = '#1a3a1a';
  wheelCtx.lineWidth = 1;
  wheelCtx.stroke();

  // Tick marks (60 divisions)
  for (let i = 0; i < 60; i++) {
    const angle = (i / 60) * Math.PI * 2 - Math.PI / 2 + wheelRotation;
    const inner = i % 5 === 0 ? outerR - 10 : outerR - 5;
    wheelCtx.beginPath();
    wheelCtx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
    wheelCtx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
    wheelCtx.strokeStyle = i % 5 === 0 ? '#2a5a2a' : '#1a3a1a';
    wheelCtx.lineWidth = 1;
    wheelCtx.stroke();
  }

  // Inner ring
  const innerR = outerR * 0.55;
  wheelCtx.beginPath();
  wheelCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
  wheelCtx.strokeStyle = '#1a3a1a';
  wheelCtx.lineWidth = 1;
  wheelCtx.stroke();

  // Slot arcs
  if (slotCount > 0) {
    // Show up to 16 slots on the wheel
    const displaySlots = slotKeys.slice(0, 16);
    const arcSize = (Math.PI * 2) / Math.max(displaySlots.length, 16);

    displaySlots.forEach((key, i) => {
      const startAngle = i * arcSize - Math.PI / 2 + wheelRotation;
      const endAngle = startAngle + arcSize * 0.85;

      // Arc on outer ring
      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, outerR - 2, startAngle, endAngle);
      wheelCtx.strokeStyle = '#00ff41';
      wheelCtx.lineWidth = 2;
      wheelCtx.globalAlpha = 0.6;
      wheelCtx.stroke();
      wheelCtx.globalAlpha = 1;

      // Arc on inner ring
      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, innerR + 2, startAngle, endAngle);
      wheelCtx.strokeStyle = '#00cccc';
      wheelCtx.lineWidth = 1.5;
      wheelCtx.globalAlpha = 0.4;
      wheelCtx.stroke();
      wheelCtx.globalAlpha = 1;

      // Connecting line
      const midAngle = (startAngle + endAngle) / 2;
      wheelCtx.beginPath();
      wheelCtx.moveTo(cx + Math.cos(midAngle) * innerR, cy + Math.sin(midAngle) * innerR);
      wheelCtx.lineTo(cx + Math.cos(midAngle) * outerR, cy + Math.sin(midAngle) * outerR);
      wheelCtx.strokeStyle = '#1a3a1a';
      wheelCtx.lineWidth = 0.5;
      wheelCtx.stroke();
    });
  }

  // Current time indicator
  const nowAngle = (state.now % 60 / 60) * Math.PI * 2 - Math.PI / 2;
  wheelCtx.beginPath();
  wheelCtx.moveTo(cx, cy);
  wheelCtx.lineTo(cx + Math.cos(nowAngle) * outerR, cy + Math.sin(nowAngle) * outerR);
  wheelCtx.strokeStyle = '#00ff41';
  wheelCtx.lineWidth = 1.5;
  wheelCtx.globalAlpha = 0.8;
  wheelCtx.stroke();
  wheelCtx.globalAlpha = 1;

  // Center dot
  wheelCtx.beginPath();
  wheelCtx.arc(cx, cy, 3, 0, Math.PI * 2);
  wheelCtx.fillStyle = '#00ff41';
  wheelCtx.fill();

  // Labels
  wheelCtx.fillStyle = '#1a3a1a';
  wheelCtx.font = '9px "Courier New", monospace';
  wheelCtx.textAlign = 'center';
  wheelCtx.fillText('SCHEDULED-DB', cx, cy + 3);
  wheelCtx.fillStyle = '#3a5a3a';
  wheelCtx.font = '7px "Courier New", monospace';
  wheelCtx.fillText(slotCount + ' slots · ' + (state.total_executed || 0) + ' exec', cx, cy + 16);

  // HUD in corner
  wheelCtx.textAlign = 'left';
  wheelCtx.fillStyle = '#1a3a1a';
  wheelCtx.font = '8px "Courier New", monospace';
  wheelCtx.fillText('T+' + (state.tick_count || 0), 8, 12);
  wheelCtx.fillText('◈' + jobCount(), 8, 22);

  // Animate rotation
  wheelRotation += 0.008 * (state.clock_speed || 1);
}

function jobCount() {
  return state.jobs ? Object.keys(state.jobs).length : 0;
}

let wheelAnimId = null;
function startWheelAnimation() {
  function frame() {
    drawWheel();
    wheelAnimId = requestAnimationFrame(frame);
  }
  if (wheelAnimId) cancelAnimationFrame(wheelAnimId);
  frame();
}

// ── Refresh Loop ───────────────────────────────
let refreshInterval = null;
function startRefresh() {
  refresh();
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(refresh, 500);
}

// ── Simulator Commands ─────────────────────────
function cmdTick() {
  if (!ready) { toast('simulator not loaded', true); return; }
  try {
    const result = JSON.parse(sim.tick());
    toast('tick: ' + result.executed + ' executed, ' + result.rescheduled + ' rescheduled');
    refresh();
  } catch(e) {
    toast('tick failed: ' + e.message, true);
  }
}

function cmdAdvance(seconds) {
  if (!ready) { toast('simulator not loaded', true); return; }
  try {
    const result = JSON.parse(sim.advanceTime(seconds));
    toast('advanced ' + seconds + 's → now ' + result.now);
    refresh();
  } catch(e) {
    toast('advance failed: ' + e.message, true);
  }
}

function cmdSpeed(speed) {
  if (!ready) { toast('simulator not loaded', true); return; }
  try {
    sim.setClockSpeed(speed);
    toast('speed → ' + speed + 'x');
    refresh();
  } catch(e) {
    toast('speed failed: ' + e.message, true);
  }
}

function cmdReset() {
  if (!ready) { toast('simulator not loaded', true); return; }
  try {
    sim.reset();
    toast('simulator reset');
    refresh();
  } catch(e) {
    toast('reset failed: ' + e.message, true);
  }
}

function cmdCreate(jobData) {
  if (!ready) { toast('simulator not loaded', true); return; }
  try {
    const result = JSON.parse(sim.createJob(JSON.stringify(jobData)));
    if (result.error) {
      toast('create failed: ' + result.error, true);
    } else {
      toast('job created: ' + (result.data ? result.data.id || result.data.slice(0,8) : 'ok'));
      refresh();
    }
  } catch(e) {
    toast('create failed: ' + e.message, true);
  }
}

// ── Terminal Input ─────────────────────────────
const cmdInput = document.getElementById('cmd-input');
cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = cmdInput.value.trim();
    cmdInput.value = '';
    processCommand(val);
  }
});

function processCommand(input) {
  if (!input) return;
  const parts = input.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch(cmd) {
    case 'help':
      toast('commands: create, tick, advance <s>, speed <n>, reset, jobs');
      break;
    case 'tick':
      cmdTick();
      break;
    case 'advance':
      cmdAdvance(parseFloat(args[0]) || 10);
      break;
    case 'speed':
      cmdSpeed(parseFloat(args[0]) || 1);
      break;
    case 'reset':
      cmdReset();
      break;
    case 'create':
      openCreateModal();
      break;
    case 'jobs':
      refresh();
      toast(Object.keys(state.jobs || {}).length + ' jobs');
      break;
    default:
      toast('unknown: ' + cmd + ' (try help)', true);
  }
}

// ── Modal ──────────────────────────────────────
const modalOverlay = document.getElementById('modal-overlay');
const modalType = document.getElementById('modal-type');
const modalTs = document.getElementById('modal-ts');
const modalCron = document.getElementById('modal-cron');
const modalTsLabel = document.getElementById('modal-ts-label');
const modalCronLabel = document.getElementById('modal-cron-label');
const modalWebhook = document.getElementById('modal-webhook');
const modalPayload = document.getElementById('modal-payload');

modalType.addEventListener('change', () => {
  const isRecurrente = modalType.value === 'recurrente';
  modalTsLabel.style.display = isRecurrente ? 'none' : 'block';
  modalTs.style.display = isRecurrente ? 'none' : 'block';
  modalCronLabel.style.display = isRecurrente ? 'block' : 'none';
  modalCron.style.display = isRecurrente ? 'block' : 'none';
});

function openCreateModal() {
  modalOverlay.classList.add('open');
  modalTs.value = new Date(Date.now() + 3600000).toISOString().slice(0,19) + 'Z';
  modalCron.value = '0 * * * *';
  modalWebhook.value = '';
  modalPayload.value = '';
  modalTs.focus();
}

function closeModal() {
  modalOverlay.classList.remove('open');
  cmdInput.focus();
}

document.getElementById('modal-cancel').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

document.getElementById('modal-submit').addEventListener('click', () => {
  const type = modalType.value;
  const jobData = { type };

  if (type === 'unico') {
    if (modalTs.value) jobData.timestamp = modalTs.value;
  } else {
    if (modalCron.value) jobData.cron_expression = modalCron.value;
  }
  if (modalWebhook.value) jobData.webhook_url = modalWebhook.value;
  if (modalPayload.value) {
    try {
      jobData.payload = JSON.parse(modalPayload.value);
    } catch(e) {
      toast('invalid payload JSON', true);
      return;
    }
  }

  cmdCreate(jobData);
  closeModal();
});

// ── Button Handlers ────────────────────────────
document.getElementById('btn-tick').addEventListener('click', cmdTick);
document.getElementById('btn-create').addEventListener('click', openCreateModal);
document.getElementById('btn-reset').addEventListener('click', () => {
  if (confirm('reset simulator?')) cmdReset();
});

// ── Init ───────────────────────────────────────
initWheelCanvas();
setTimeout(() => {
  resizeWheel();
  startRefresh();
  loadWasm();
}, 100);

// ── Keyboard shortcuts ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (modalOverlay.classList.contains('open')) return;
  if (e.key === 'Tab') {
    e.preventDefault();
    document.getElementById('btn-tick').focus();
  }
  if (e.key === 't' && !e.ctrlKey && !e.metaKey && document.activeElement !== cmdInput) {
    cmdTick();
  }
});

// ── Global error handler for WASM ──────────────
window.addEventListener('error', (e) => {
  toast('runtime error: ' + e.message, true);
});
</script>
</body>
</html>
